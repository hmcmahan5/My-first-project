<title>Hobie's Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one reading column; a "first things" list on top, then schedule and inbox side by side on wide screens, then notes. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5a6875;
  --line: #d9e0e6;
  --accent: #1f5f8b;
  --accent-soft: #e3eef6;
  --due: #b4442c;
  --due-soft: #f8e6e1;
  --ok: #2f7a4f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #18212a; --fg: #e6ecf1; --muted: #9aa8b5; --line: #2a3642;
    --accent: #7fb6dd; --accent-soft: #1d3346; --due: #f08b72; --due-soft: #3a211c; --ok: #7ccf9c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #18212a; --fg: #e6ecf1; --muted: #9aa8b5; --line: #2a3642;
  --accent: #7fb6dd; --accent-soft: #1d3346; --due: #f08b72; --due-soft: #3a211c; --ok: #7ccf9c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
.headline { color: var(--muted); max-width: 62ch; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 20px; margin: 0; }
.section { display: grid; gap: 12px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--font-data); font-size: 12px; color: var(--muted); }

/* First things */
.first { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; }
.first ol { list-style: none; margin: 0; padding: 0; counter-reset: p; }
.first li { counter-increment: p; display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 12px; padding: 14px 18px; border-top: 1px solid var(--line); align-items: start; }
.first li:first-child { border-top: 0; }
.first li::before { content: counter(p); font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--accent); line-height: 1.1; }
.first li.done .p-title { text-decoration: line-through; color: var(--muted); }
.p-body { min-width: 0; display: grid; gap: 2px; }
.p-title { font-weight: 600; }
.p-why { color: var(--muted); font-size: 15px; }
.p-src { font-family: var(--font-data); font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.check { width: 22px; height: 22px; accent-color: var(--accent); margin-top: 2px; cursor: pointer; }
.chip { display: inline-block; font-family: var(--font-data); font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.due { background: var(--due-soft); color: var(--due); }

/* Two-up */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } .first li { grid-template-columns: 26px 1fr auto; padding: 12px 14px; } }

.list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.time { font-family: var(--font-data); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 2px; }
.r-title { font-weight: 600; }
.r-sub { color: var(--muted); font-size: 14px; }
.row.gap .r-title { color: var(--muted); font-weight: 400; font-style: italic; }
.day { font-family: var(--font-data); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 0 4px; }

.mail { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mail-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mail-from { font-weight: 600; }
.mail-ask { font-size: 15px; }

.notes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
@media (max-width: 760px) { .notes { grid-template-columns: 1fr; } }

/* To-do checklist */
.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .4s ease; }
@media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
.todo-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 18px; }
.todo-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
@media (max-width: 760px) { .todo-list { grid-template-columns: 1fr; } }
.todo-list li { border-bottom: 1px solid var(--line); min-width: 0; }
.todo-list label { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; padding: 10px 0; cursor: pointer; }
.todo-list label span { min-width: 0; overflow-wrap: anywhere; }
.todo-list li.is-done label span { text-decoration: line-through; color: var(--muted); }
.todo-list .check { margin-top: 1px; }
#done-wrap { padding: 10px 0 6px; }
#done-wrap summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 0; }
#done-wrap summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.todo-empty { padding: 12px 0; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.empty code { font-family: var(--font-data); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; }

footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; }
input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="prepared"></div>
    <h1 id="date"></h1>
    <p class="headline" id="headline"></p>
  </header>

  <section class="section" aria-labelledby="h-first">
    <div class="section-head"><h2 id="h-first">Do these first</h2><span class="count" id="first-count"></span></div>
    <div class="first"><ol id="priorities"></ol></div>
  </section>

  <div class="two">
    <section class="section" aria-labelledby="h-today">
      <h2 id="h-today">Today</h2>
      <div class="list" id="schedule"></div>
      <div id="week"></div>
    </section>
    <section class="section" aria-labelledby="h-mail">
      <div class="section-head"><h2 id="h-mail">Emails waiting on you</h2><span class="count" id="mail-count"></span></div>
      <div class="list" id="emails"></div>
    </section>
  </div>

  <section class="section" aria-labelledby="h-todo">
    <div class="section-head"><h2 id="h-todo">To-do list</h2><span class="count" id="todo-count"></span></div>
    <div class="progress" role="progressbar" aria-labelledby="h-todo" id="todo-progress" aria-valuemin="0" aria-valuemax="100"><span id="todo-bar"></span></div>
    <div class="todo-card">
      <ul class="todo-list" id="todos"></ul>
      <details id="done-wrap" hidden>
        <summary id="done-sum"></summary>
        <ul class="todo-list done-list" id="done-list"></ul>
      </details>
    </div>
    <p class="empty" id="todo-note"></p>
  </section>

  <div class="notes">
    <section class="note" aria-labelledby="h-fu">
      <h2 id="h-fu">Meeting follow-ups</h2>
      <div id="followups"></div>
    </section>
    <section class="note" aria-labelledby="h-ideas">
      <h2 id="h-ideas">Ideas and learning</h2>
      <div id="ideas"></div>
    </section>
  </div>

  <footer>
    <div><strong>Built from:</strong> <span id="sources"></span></div>
    <div>Rebuilt automatically Monday through Thursday at about 7:30 a.m. Eastern, and Friday through Sunday only when something is due.</div>
  </footer>
</div>

<script>
(function () {
  var d = JSON.parse(document.getElementById('brief-data').textContent);
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  document.getElementById('prepared').textContent = d.preparedAt;
  document.getElementById('date').textContent = d.dateLabel;
  document.getElementById('headline').textContent = d.headline;
  document.getElementById('sources').textContent = d.sources.join(' · ');

  // Check-offs. Saved to the page's shared store (collection "done", one doc per item)
  // so they follow you across devices and the morning routine can read them.
  // Falls back to this browser's storage when the store isn't available.
  var done = {};
  var db = null;
  var priorityRows = [];
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120) || 'item'; }
  function loadLocal() {
    var keys = priorityRows.map(function (r) { return r.key; }).concat(d.todos.map(function (t) { return 't-' + slug(t); }));
    keys.forEach(function (k) { if (store('done:' + k) === '1') done[k] = { text: k, doneAt: '' }; });
  }
  function setDone(key, text, kind, on) {
    if (on) done[key] = { text: text, kind: kind, doneAt: new Date().toISOString() };
    else delete done[key];
    refresh();
    if (db) {
      var ref = db.doc('done/' + key);
      (on ? ref.set(done[key]) : ref.delete()).catch(function () {
        document.getElementById('todo-note').textContent = "That change didn't save. Check your connection and try again.";
      });
    } else {
      store('done:' + key, on ? '1' : '0');
    }
  }

  var ol = document.getElementById('priorities');
  d.priorities.forEach(function (p, i) {
    var li = el('li');
    var body = el('div', 'p-body');
    body.append(el('div', 'p-title', p.title), el('div', 'p-why', p.why), el('div', 'p-src', p.source));
    var right = el('div');
    right.style.display = 'grid'; right.style.gap = '8px'; right.style.justifyItems = 'end';
    right.append(el('span', 'chip' + (p.urgent ? ' due' : ''), p.tag));
    var key = 'p-' + slug(p.title);
    var cb = el('input', 'check'); cb.type = 'checkbox'; cb.id = 'chk-' + key;
    cb.setAttribute('aria-label', 'Mark done: ' + p.title);
    cb.addEventListener('change', function () { setDone(key, p.title, 'priority', cb.checked); });
    right.append(cb);
    li.append(body, right);
    ol.append(li);
    priorityRows.push({ key: key, cb: cb, li: li });
  });

  function todoRow(key, text, isDone) {
    var li = el('li', isDone ? 'is-done' : null);
    var label = el('label');
    var cb = el('input', 'check'); cb.type = 'checkbox'; cb.id = 'chk-' + key; cb.checked = isDone;
    cb.addEventListener('change', function () { setDone(key, text, 'todo', cb.checked); });
    label.append(cb, el('span', null, text));
    li.append(label);
    return li;
  }

  function refresh() {
    var openCount = 0;
    priorityRows.forEach(function (r) {
      var on = !!done[r.key];
      r.cb.checked = on; r.li.classList.toggle('done', on);
      if (!on) openCount++;
    });
    document.getElementById('first-count').textContent = openCount === 0 ? 'All done' : openCount + ' of ' + priorityRows.length + ' left';

    var list = document.getElementById('todos');
    var doneList = document.getElementById('done-list');
    list.textContent = ''; doneList.textContent = '';
    var todayKeys = {};
    var left = 0, finished = 0;
    d.todos.forEach(function (t) {
      var key = 't-' + slug(t);
      todayKeys[key] = true;
      if (done[key]) { finished++; doneList.append(todoRow(key, t, true)); }
      else { left++; list.append(todoRow(key, t, false)); }
    });
    // Items checked off on earlier days drop out of the morning list; keep showing the past week's.
    var weekAgo = Date.now() - 7 * 864e5;
    Object.keys(done).forEach(function (key) {
      var it = done[key];
      if (todayKeys[key] || it.kind !== 'todo' || !it.doneAt || Date.parse(it.doneAt) < weekAgo) return;
      finished++;
      doneList.append(todoRow(key, it.text, true));
    });
    if (!d.todos.length) {
      var p = el('li', 'todo-empty'); p.innerHTML = '<p class="empty">No list yet. At the end of the day, email your Apple Notes list to yourself with a subject like <code>Notes To Do</code>.</p>';
      list.append(p);
    } else if (!left) {
      var p2 = el('li', 'todo-empty'); p2.append(el('p', 'empty', 'Everything on the list is checked off.'));
      list.append(p2);
    }
    var total = left + finished;
    var pct = total ? Math.round(finished / total * 100) : 0;
    document.getElementById('todo-bar').style.width = pct + '%';
    document.getElementById('todo-progress').setAttribute('aria-valuenow', pct);
    document.getElementById('todo-count').textContent = left + ' left · ' + finished + ' done';
    var wrap = document.getElementById('done-wrap');
    wrap.hidden = finished === 0;
    document.getElementById('done-sum').textContent = 'Checked off (' + finished + ')';
  }

  loadLocal();
  refresh();
  document.getElementById('todo-note').textContent = 'Check-offs are saved in this browser only.';

  var use = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null);
  use.then(function (store_) {
    if (!store_) return;
    db = store_;
    db.collection('done').onSnapshot(function (snap) {
      done = {};
      snap.docs.forEach(function (doc) { done[doc.id] = doc.data(); });
      document.getElementById('todo-note').textContent = 'Check-offs sync across your devices, and tomorrow’s brief leaves them off.';
      refresh();
    }, function () {
      document.getElementById('todo-note').textContent = 'Check-offs stopped syncing. Reload the page to reconnect.';
    });
  }, function () {});

  var sch = document.getElementById('schedule');
  if (!d.schedule.length) sch.append(el('p', 'empty', 'Nothing on your calendar today.'));
  d.schedule.forEach(function (s) {
    var r = el('div', 'row' + (s.gap ? ' gap' : ''));
    r.append(el('div', 'time', s.end ? s.start + '–' + s.end : s.start));
    var b = el('div'); b.style.minWidth = '0';
    b.append(el('div', 'r-title', s.title));
    if (s.where) b.append(el('div', 'r-sub', s.where));
    r.append(b); sch.append(r);
  });

  var wk = document.getElementById('week');
  if (d.week && d.week.length) {
    wk.append(el('h2', null, 'Rest of the week')); wk.firstChild.style.marginTop = '12px';
    d.week.forEach(function (w) {
      wk.append(el('div', 'day', w.day));
      var l = el('div', 'list');
      if (!w.items.length) { var r = el('div', 'row gap'); r.append(el('div', 'time', ''), el('div', 'r-title', 'Nothing scheduled')); l.append(r); }
      w.items.forEach(function (it) { var r = el('div', 'row'); r.append(el('div', 'time', it.time), el('div', 'r-title', it.title)); l.append(r); });
      wk.append(l);
    });
  }

  var em = document.getElementById('emails');
  if (!d.emails.length) em.append(el('p', 'empty', 'Nothing in your inbox is waiting on you.'));
  d.emails.forEach(function (m) {
    var c = el('div', 'mail');
    var top = el('div', 'mail-top');
    top.append(el('span', 'mail-from', m.from), el('span', 'chip' + (m.flag === 'Unread' || m.flag === 'Action' ? ' due' : ''), m.flag), el('span', 'count', m.when));
    c.append(top, el('div', 'r-sub', m.subject), el('div', 'mail-ask', m.ask));
    em.append(c);
  });
  document.getElementById('mail-count').textContent = d.emails.length + ' need you';

  function fillNote(id, items, emptyHtml) {
    var box = document.getElementById(id);
    if (!items.length) { var p = el('p', 'empty'); p.innerHTML = emptyHtml; box.append(p); return; }
    var ul = el('ul');
    items.forEach(function (t) { ul.append(el('li', null, typeof t === 'string' ? t : t.text)); });
    box.append(ul);
  }
  fillNote('followups', d.followups, 'No meeting notes yet. Email your Granola notes to yourself and action items show up here the next morning.');
  fillNote('ideas', d.ideas, 'Email yourself anything with the subject <code>Idea</code> or <code>Learning</code> and it collects here.');
})();
</script>
